<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><link rel="alternate" hreflang="zh" href="points.html"><link rel="alternate" hreflang="en" href="points-en.html"><script src="../lang.js"></script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#f6f3f9"><link rel="icon" type="image/png" href="/icons/favicon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="雅实"><script src="/pwa.js" defer></script><script src="../share.js" defer></script>
<meta name="robots" content="noindex">
<meta name="description" content="消费后上传小票照片，审核后积分自动入账。合作商家和 Grace Rock 自营活动都算。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="雅实 Grace Rock Group">
<meta property="og:title" content="上传小票领积分">
<meta property="og:description" content="消费后上传小票照片，审核后积分自动入账。合作商家和 Grace Rock 自营活动都算。">
<meta property="og:url" content="https://gracerock.com.au/preview/points.html">
<meta property="og:image" content="https://gracerock.com.au/preview/og-cover.jpg?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上传小票领积分 · 雅实</title>
<style>
:root{--bg:#f6f3f9;--card:#fff;--text:#2a2233;--sub:#665b72;--accent:#6b4f99;--accent-t:#fff;--soft:#ece5f5;--line:#e1d9eb;--warn:#8a5a14;--warn-bg:#fbf3e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131c;--card:#211b28;--text:#efeaf4;--sub:#a99fb4;--accent:#b9a2e6;--accent-t:#1a1222;--soft:#2c2436;--line:#352d40;--warn:#f0c77c;--warn-bg:#2e2617}}
:root[data-theme="dark"]{--bg:#17131c;--card:#211b28;--text:#efeaf4;--sub:#a99fb4;--accent:#b9a2e6;--accent-t:#1a1222;--soft:#2c2436;--line:#352d40;--warn:#f0c77c;--warn-bg:#2e2617}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.65}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
a{color:var(--accent)}
.top{text-align:center;padding:8px 0 4px}
.top img{width:96px;height:96px;display:block;margin:0 auto}
.brand{font-family:"Noto Serif SC","Songti SC",serif;font-weight:700;font-size:15px;color:var(--sub);margin:0}
h1{font-size:28px;margin:8px 0 6px;text-align:center}
.lead{color:var(--sub);text-align:center;margin:0 0 6px}
.trial{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--warn-bg);color:var(--warn);border:1px solid currentColor}
h2{font-size:19px;margin:32px 0 12px}
p{margin:0}
.muted{color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.roles{display:grid;gap:10px}
.role{display:block;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:inherit}
.role:hover,.role:focus-visible{border-color:var(--accent)}
.role b{font-size:17px}
.role .id{float:right;font:600 12px/1.8 ui-monospace,Menlo,monospace;color:var(--accent);background:var(--soft);padding:0 8px;border-radius:6px}
.role p{color:var(--sub);font-size:14px;margin-top:4px}
.role .go{display:block;margin-top:6px;font-size:14px;font-weight:600;color:var(--accent)}
ol.rules{margin:0;padding:0;list-style:none;counter-reset:r}
ol.rules li{counter-increment:r;position:relative;padding:10px 0 10px 34px;border-top:1px solid var(--line)}
ol.rules li:first-child{border-top:0;padding-top:0}
ol.rules li:first-child::before{top:0}
ol.rules li::before{content:counter(r);position:absolute;left:0;top:10px;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
ol.rules b{display:block}
ol.rules span{color:var(--sub);font-size:14px}
.code{font:600 15px ui-monospace,Menlo,monospace;background:var(--soft);padding:2px 8px;border-radius:6px}
.labels{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.labels span{font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.labels b{color:var(--text);font-weight:600}
.alert{background:var(--warn-bg);color:var(--text);border-color:transparent}
.alert b{color:var(--warn)}
form label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
form label small{font-weight:400;color:var(--sub)}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:72px;resize:vertical}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick label{margin:0;font-weight:600;font-size:14px;text-align:center;border:2px solid var(--line);border-radius:12px;padding:10px 4px;cursor:pointer;background:var(--bg)}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){border-color:var(--accent);background:var(--soft);color:var(--accent)}
.pick label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.only{display:none}
form[data-role="C"] .only.C,form[data-role="S"] .only.S,form[data-role="V"] .only.V{display:block}
.agree{display:flex!important;gap:8px;align-items:flex-start;font-weight:400!important;font-size:14px!important;color:var(--sub)}
.agree input{margin-top:4px;width:18px;height:18px;flex:none}
.btn{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-t);font:inherit;font-size:16px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--accent);border:2px solid var(--accent);margin-top:10px}
.err{color:#c0392b;font-size:14px;margin-top:8px}
footer{text-align:center;font-size:13px;color:var(--sub);margin-top:32px}
input[type=number],input[type=date],select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:2px dashed var(--line);border-radius:14px;background:var(--bg);cursor:pointer;text-align:center;padding:12px;font-weight:600;color:var(--accent)}
.drop small{font-weight:400;color:var(--sub)}
.drop img{max-height:220px;max-width:100%;border-radius:10px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:13px;color:var(--sub)}
.steps b{display:block;font-size:22px}
.ok{text-align:center}
.ok b{display:block;font-size:20px;margin:6px 0}
</style>
</head>
<body>
<main>
  <div class="top">
    <img src="/icons/icon-192.png" alt="雅实 Grace Rock">
    <p class="brand">雅实 GRACE ROCK GROUP</p>
  </div>
  <h1>上传小票，领积分</h1>
  <p class="lead">在合作商家或 Grace Rock 自营活动消费后，拍一张小票上传就行。</p>
  <p style="text-align:center"><span class="trial">会员积分 · 试运行中</span></p>

  <div class="card steps" style="margin-top:18px"><div><b>📸</b>拍小票</div><div><b>⬆️</b>上传</div><div><b>⭐</b>审核后入账</div></div>

  <div class="card" id="box">
    <form id="f" novalidate>
      <label for="mid" style="margin-top:0">会员号或手机号</label>
      <input type="text" id="mid" placeholder="例如 GR-C-AU-0001" autocapitalize="characters">
      <p class="muted" style="font-size:13px;margin-top:4px">还不是会员？<a href="join.html#join-C">免费加入 ›</a></p>
      <label for="where">在哪里消费</label>
      <select id="where"><option value="">请选择</option><option value="1">Grace Rock 自营活动（活动报名、水云间等）</option><option value="2">百草 Herbmax</option><option value="3">其他合作商家（下面写店名）</option></select>
      <div id="otherbox" hidden><label for="other">店名</label><input type="text" id="other"></div>
      <label for="amt">金额（澳元）</label>
      <input type="number" id="amt" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
      <label for="date">消费日期</label>
      <input type="date" id="date">
      <label>小票照片</label>
      <label class="drop" id="drop"><input type="file" id="photo" accept="image/*"><span id="droptxt">📷 点这里拍照或选照片<br><small>看得清店名、日期和金额就行</small></span></label>
      <p class="err" id="err" hidden></p>
      <button class="btn" type="submit">提交小票</button>
    </form>
    <div class="ok" id="ok" hidden><div style="font-size:40px">✅</div><b>收到了，谢谢！</b><p class="muted">我们会在 3 个工作日内核对，积分入账后通知你。</p><p class="muted" style="font-size:12px;margin-top:6px">（预览版：这里还不会真的提交）</p><button class="btn alt" type="button" id="again">再传一张</button></div>
  </div>

  <div class="card"><ul style="margin:0;padding-left:20px;color:var(--sub);font-size:14px"><li>每 $1 = 1 分，审核后 3 个工作日内入账。</li><li>同一张小票只算一次，请上传真实小票。</li><li>积分不是钱，不能换现金，永久保留。</li></ul><p style="font-size:14px;margin-top:8px"><a href="join.html">完整会员规则 ›</a></p></div>

  <footer>雅实 Grace Rock Group · 携手同行，共创美好<br><a href="./">返回首页</a></footer>
</main>
<script>
(function(){
  var f=document.getElementById('f'),err=document.getElementById('err'),ok=document.getElementById('ok');
  var d=document.getElementById('date');d.value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  var w=document.getElementById('where');w.addEventListener('change',function(){document.getElementById('otherbox').hidden=w.value!=='3'});
  var ph=document.getElementById('photo'),dt=document.getElementById('droptxt');
  ph.addEventListener('change',function(){var x=ph.files&&ph.files[0];if(!x)return;var u=URL.createObjectURL(x);dt.innerHTML='<img src="'+u+'" alt="">'});
  function v(id){return document.getElementById(id).value.trim()}
  function bad(m){err.hidden=false;err.textContent=m}
  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(!v('mid'))return bad('请填写会员号或手机号。');
    if(!w.value)return bad('请选择在哪里消费。');
    if(!(parseFloat(v('amt'))>0))return bad('请填写金额。');
    if(!(ph.files&&ph.files[0]))return bad('请上传小票照片。');
    err.hidden=true;
    /* TODO: send to the Google Sheet + Drive backend (Apps Script) once Grace deploys it. */
    f.hidden=true;ok.hidden=false;
  });
  document.getElementById('again').addEventListener('click',function(){f.reset();d.value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);dt.innerHTML='📷 点这里拍照或选照片<br><small>看得清店名、日期和金额就行</small>';ok.hidden=true;f.hidden=false});
})();
</script>
</body>
</html>
