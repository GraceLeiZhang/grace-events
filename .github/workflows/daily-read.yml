name: 每日一读

on:
  schedule:
    - cron: "0 20 * * *" # 悉尼夏令时早上 7 点（冬令时 6 点）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-read
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "anthropic>=2.6,<3"
      - run: python scripts/daily_read.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: 提交今天的文章
        run: |
          git add preview/daily
          if git diff --cached --quiet; then echo "没有新内容"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "每日一读 $(TZ=Australia/Sydney date +%F)"
          git push
